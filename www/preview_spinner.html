<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة دائرة التحميل - Antiko</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            direction: rtl;
        }

        .preview-container {
            text-align: center;
        }

        /* SVG Spinner container */
        .spinner-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px auto;
        }

        /* Continuous rotation animation mimicking the Android ObjectAnimator */
        .spinner-svg {
            width: 100%;
            height: 100%;
            animation: rotate_spinner 1.0s linear infinite;
        }

        @keyframes rotate_spinner {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Info box */
        h2 {
            font-weight: 500;
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
        }

        p {
            color: #888888;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="spinner-wrapper">
            <!-- Exact replica of spinner_circle.xml vector properties -->
            <svg class="spinner-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path 
                    d="M 50,15 A 35,35 0 1 1 15,50" 
                    fill="none" 
                    stroke="#ff003c" 
                    stroke-width="8" 
                    stroke-linecap="round" />
            </svg>
        </div>
        <h2>معاينة شاشة التحميل (Splash Screen)</h2>
        <p>هذا هو الشكل واللون الدقيق للدائرة وسرعة حركتها عند تشغيل التطبيق.</p>
    </div>
</body>
</html>
