<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعم الفني - Antiko</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=Orbitron:wght@600;800;900&family=Anton&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/shared.css?v=2.0.2">
    <link rel="stylesheet" href="css/admin.css?v=2.0.2">
    <link rel="stylesheet" href="css/app.css?v=2.0.2">
    <link rel="stylesheet" href="css/laptop-ui.css?v=2.0.2">
    <link rel="stylesheet" href="css/mobile-opt.css">
    <style>
        :root {
            --bg-dark: #000000 !important;
        }

        body {
            background-color: #000000 !important;
        }

        .support-page-box {
            background: rgba(10, 10, 15, 0.65);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 30px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        #support-chat-box {
            height: 380px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <script type="module" src="js/flags.js"></script>
    <script src="js/main-init.js"></script>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-effects">
        <canvas id="bg-lines" class="bg-lines-canvas"></canvas>
        <div class="cyber-grid"></div>
        <div class="red-flare top-right"></div>
        <div class="red-flare bottom-left"></div>
        <div class="scanlines"></div>
        <div class="noise"></div>
    </div>

    <!-- Navigation -->
    <nav class="container top-nav">
        <div style="display: flex; gap: 10px;">
            <button onclick="window.location.href='index.html'" class="premium-btn secondary nav-btn-small">
                <i class="ph ph-house"></i> الرئيسية
            </button>
            <button onclick="window.history.back()" class="premium-btn secondary nav-btn-small" style="background: rgba(255, 0, 60, 0.1); border-color: var(--neon-red); color: var(--neon-red);">
                <i class="ph ph-arrow-left"></i> رجوع
            </button>
        </div>
        <div id="admin-controls">
            <button id="nav-login-btn" class="premium-btn secondary nav-btn-small">تسجيل الدخول</button>
            <button id="nav-dashboard-btn" class="premium-btn hidden nav-btn-small">
                <i class="ph ph-squares-four"></i> لوحة التحكم
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="position: relative; z-index: 10;">
        <div class="support-page-box">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
                <i class="ph ph-headset" style="font-size: 2.2rem; color: var(--neon-red);"></i>
                <h2 style="margin: 0; color: #fff; border: none; padding: 0; font-size: 1.6rem;">الدعم الفني المباشر</h2>
            </div>
            
            <!-- Safe loading text before auth state confirms user -->
            <div id="support-chat-container">
                <div id="support-chat-box">
                    <div style="background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 15px; border-bottom-right-radius: 0; align-self: flex-start; max-width: 85%; font-size: 0.9rem; color: #ddd;">
                        يرجى تسجيل الدخول أولاً لتتمكن من التحدث إلى الدعم الفني وحفظ تذكرتك.
                    </div>
                </div>

                <form id="support-form" style="display: flex; gap: 10px;">
                    <input type="text" id="support-msg-input"
                        style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px 20px; border-radius: 30px; font-size: 0.95rem; outline: none;"
                        placeholder="اكتب رسالتك للمشرف..." required autocomplete="off">
                    <button type="submit" id="support-submit-btn"
                        style="width: 50px; height: 50px; border-radius: 50%; background: var(--neon-red); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; transition: transform 0.2s;">
                        <i class="ph-fill ph-paper-plane-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Privacy Policy Modal for login trigger -->
    <div id="privacy-policy-modal" class="modal-overlay hidden" style="z-index: 3000;">
        <div class="modal" style="max-width: 450px; padding: 30px;">
            <div class="text-center mb-4">
                <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 15px; border: none; padding: 0;">سياسة الخصوصية</h2>
            </div>
            <div id="agree-container" style="display: flex; align-items: center; gap: 12px; margin-bottom: 25px; cursor: pointer; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px;">
                <div id="agree-checkbox" style="width: 24px; height: 24px; border: 2px solid var(--neon-red); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <i class="ph-fill ph-check hidden" style="color: #fff; font-size: 16px;"></i>
                </div>
                <span style="font-size: 0.95rem; color: #fff;">أوافق على كافة شروط خصوصية الدعم</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="privacy-cancel-btn" class="premium-btn secondary" style="flex: 1;">إلغاء</button>
                <button id="privacy-next-btn" class="premium-btn disabled" style="flex: 2; opacity: 0.5; pointer-events: none;">التالي</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal" style="max-width: 400px; padding: 40px;">
            <button class="modal-close" onclick="closeModal('login-modal')"><i class="ph ph-x"></i></button>
            <div class="text-center mb-4">
                <h2 id="auth-modal-title" style="font-size: 1.5rem; color: #fff;">تسجيل الدخول</h2>
            </div>
            <form id="login-form">
                <div id="login-error" class="hidden" style="color: var(--neon-red); margin-bottom: 15px; text-align: center; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px;"></div>
                <div class="form-group">
                    <input type="email" id="admin-email" class="form-control" required placeholder="البريد الإلكتروني">
                </div>
                <div class="form-group mt-2">
                    <input type="password" id="admin-password" class="form-control" required placeholder="كلمة المرور">
                </div>
                <button type="submit" class="premium-btn w-100 mt-4" id="login-submit-btn">دخول</button>
            </form>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <div class="bottom-nav-item" onclick="window.location.href='index.html'">
            <i class="ph-fill ph-house"></i>
            <span>الرئيسية</span>
        </div>
        <div class="bottom-nav-item" onclick="window.location.href='ai.html'">
            <i class="ph-fill ph-sparkle"></i>
            <span>المساعد</span>
        </div>
        <div class="bottom-nav-item active" onclick="window.location.href='support.html'">
            <i class="ph-fill ph-headset"></i>
            <span>الدعم</span>
        </div>
        <div class="bottom-nav-item" onclick="window.location.href='settings.html'">
            <i class="ph-fill ph-gear"></i>
            <span>الإعدادات</span>
        </div>
    </nav>

    <script type="module" src="js/app.js?v=2.0.6"></script>
    <script src="js/animations.js?v=2.0.6"></script>
    <script type="module">
        import { auth, onAuthStateChanged } from './js/firebase-config.js';
        onAuthStateChanged(auth, (user) => {
            if (user && typeof window.loadChatMessages === 'function') {
                window.loadChatMessages(user);
            }
        });
    </script>
</body>

</html>
