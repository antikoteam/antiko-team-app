<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - Antiko</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=Orbitron:wght@600;800;900&family=Anton&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/shared.css?v=2.0.2">
    <link rel="stylesheet" href="css/admin.css?v=2.0.2">
    <link rel="stylesheet" href="css/app.css?v=2.0.2">
    <link rel="stylesheet" href="css/laptop-ui.css?v=2.0.2">
    <link rel="stylesheet" href="css/mobile-opt.css">
    <style>
        :root {
            --bg-dark: #000000 !important;
        }

        body {
            background-color: #000000 !important;
        }

        .settings-page-box {
            background: rgba(10, 10, 15, 0.65);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 40px;
            margin-top: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(10px);
        }
    </style>
    <script type="module" src="js/flags.js"></script>
    <script src="js/main-init.js"></script>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-effects">
        <canvas id="bg-lines" class="bg-lines-canvas"></canvas>
        <div class="cyber-grid"></div>
        <div class="red-flare top-right"></div>
        <div class="red-flare bottom-left"></div>
        <div class="scanlines"></div>
        <div class="noise"></div>
    </div>

    <!-- Navigation -->
    <nav class="container top-nav">
        <div style="display: flex; gap: 10px;">
            <button onclick="window.location.href='index.html'" class="premium-btn secondary nav-btn-small">
                <i class="ph ph-house"></i> الرئيسية
            </button>
            <button onclick="window.history.back()" class="premium-btn secondary nav-btn-small" style="background: rgba(255, 0, 60, 0.1); border-color: var(--neon-red); color: var(--neon-red);">
                <i class="ph ph-arrow-left"></i> رجوع
            </button>
        </div>
        <div id="admin-controls">
            <button id="nav-login-btn" class="premium-btn secondary nav-btn-small">تسجيل الدخول</button>
            <button id="nav-dashboard-btn" class="premium-btn hidden nav-btn-small">
                <i class="ph ph-squares-four"></i> لوحة التحكم
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="position: relative; z-index: 10;">
        <div class="settings-page-box">
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="ph-fill ph-sliders-horizontal" style="font-size: 4.5rem; color: var(--neon-red); filter: drop-shadow(0 0 10px rgba(255,0,60,0.4));"></i>
                <h2 style="font-size: 1.8rem; color: #fff; margin-top: 15px; border: none; padding: 0;">إعدادات النظام</h2>
            </div>

            <!-- Background Music Controls -->
            <div class="form-group" style="text-align: right; margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <label class="form-label" style="margin:0; font-size: 1.1rem; color: #fff;">صوت الخلفية الموسيقية</label>
                    <span id="bg-volume-label" style="color: var(--neon-red); font-weight: 800;">30%</span>
                </div>
                <input type="range" id="bg-sound-volume" min="0" max="100" value="30" class="form-control"
                    style="background: rgba(255,255,255,0.1); accent-color: var(--neon-red); height: 8px; padding: 0; cursor: pointer;">
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 30px;">
                <label class="form-label" style="margin:0; font-size: 1.1rem; color: #fff; cursor: pointer;" for="bg-sound-toggle">تفعيل الموسيقى</label>
                <input type="checkbox" id="bg-sound-toggle" checked style="width: 24px; height: 24px; accent-color: var(--neon-red); cursor: pointer;">
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 20px;">
                <label class="form-label" style="margin:0; font-size: 1.1rem; color: #fff; cursor: pointer;">إشعارات النظام</label>
                <button id="trigger-notifications-btn" class="premium-btn secondary nav-btn-small" style="margin: 0; padding: 8px 15px; font-size: 0.85rem;">
                    <i class="ph ph-bell"></i> تفعيل الإشعارات
                </button>
            </div>

            <button onclick="window.location.href='privacy.html'" class="premium-btn secondary w-100" style="padding: 12px; margin-bottom: 20px;">
                <i class="ph ph-shield-check"></i> سياسة الخصوصية
            </button>

            <button onclick="window.location.href='index.html'" class="premium-btn w-100" style="padding: 15px;">
                <i class="ph ph-check"></i> حفظ الإعدادات والرجوع
            </button>
        </div>
    </main>

    <!-- ==============================================
         ADMIN MODAL (ACCOUNT)
    =============================================== -->
    <div id="account-modal" class="modal-overlay hidden" style="z-index: 2000;">
        <div class="modal" style="max-width: 400px; padding: 40px; text-align: center;">
            <button class="modal-close" onclick="closeModal('account-modal')"><i class="ph ph-x"></i></button>

            <div style="margin-bottom: 20px;">
                <i class="ph-fill ph-user-circle" style="font-size: 5rem; color: var(--neon-red); filter: drop-shadow(0 0 10px rgba(255,0,60,0.5));"></i>
            </div>
            <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 5px;">حسابي</h2>
            <p id="account-email" style="color: var(--text-secondary); margin-bottom: 30px; font-size: 1.1rem; direction: ltr;">-</p>

            <button id="modal-dashboard-btn" class="premium-btn w-100 hidden" style="margin-bottom: 20px;">
                <i class="ph ph-squares-four"></i> لوحة التحكم
            </button>
            <button id="modal-logout-btn" class="premium-btn w-100" style="background: rgba(255,0,60,0.1); border-color: var(--neon-red); color: var(--neon-red);">
                <i class="ph ph-sign-out"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <div class="bottom-nav-item" onclick="window.location.href='index.html'">
            <i class="ph-fill ph-house"></i>
            <span>الرئيسية</span>
        </div>
        <div class="bottom-nav-item" onclick="window.location.href='ai.html'">
            <i class="ph-fill ph-sparkle"></i>
            <span>المساعد</span>
        </div>
        <div class="bottom-nav-item" id="bottom-nav-account" onclick="handleBottomNavAccount()">
            <i class="ph-fill ph-user-circle"></i>
            <span>حسابي</span>
        </div>
        <div class="bottom-nav-item" onclick="window.location.href='support.html'">
            <i class="ph-fill ph-headset"></i>
            <span>الدعم</span>
        </div>
        <div class="bottom-nav-item active" onclick="window.location.href='settings.html'">
            <i class="ph-fill ph-gear"></i>
            <span>الإعدادات</span>
        </div>
    </nav>

    <script type="module" src="js/app.js?v=2.0.6"></script>
    <script src="js/animations.js?v=2.0.6"></script>
</body>

</html>
