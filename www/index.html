<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiko</title>
    <script>
        // Prevent recursive iframe loading: if this shell is loaded inside an iframe, immediately load home.html instead
        if (window.top !== window.self) {
            window.location.replace('home.html');
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        #app-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 1;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="home.html"></iframe>

    <script>
        (function() {
            // Function to retrieve latest settings
            function getSettings() {
                try {
                    return JSON.parse(localStorage.getItem('antiko_settings')) || {
                        musicEnabled: true,
                        theme: 'dark',
                        bgMusicVolume: 50
                    };
                } catch(e) {
                    return { musicEnabled: true, theme: 'dark', bgMusicVolume: 50 };
                }
            }

            var settings = getSettings();
            var bgAudio = new Audio('assets/audio/bg.mp3');
            bgAudio.loop = true;
            bgAudio.preload = 'auto';

            function updateAudioState() {
                var currentVol = (settings.bgMusicVolume !== undefined ? settings.bgMusicVolume : 50) / 100;
                bgAudio.volume = currentVol;

                if (settings.musicEnabled) {
                    bgAudio.play().catch(function(e) {
                        console.log("[Antiko Shell] Autoplay blocked, waiting for interaction.");
                        
                        function startAudio() {
                            if (getSettings().musicEnabled) {
                                bgAudio.play().catch(function(err) {
                                    console.error("[Antiko Shell] Audio play failed:", err);
                                });
                            }
                            document.removeEventListener('click', startAudio);
                            document.removeEventListener('touchstart', startAudio);
                        }
                        document.addEventListener('click', startAudio);
                        document.addEventListener('touchstart', startAudio);
                    });
                } else {
                    bgAudio.pause();
                }
            }

            // Bind click/touch forwarding or triggers directly on the window to capture events from the child frame
            window.addEventListener('click', function() {
                if (settings.musicEnabled && bgAudio.paused) {
                    bgAudio.play().catch(function(){});
                }
            });

            // Monitor iframe loads to attach click and touch listeners directly to iframe document
            var iframe = document.getElementById('app-frame');
            if (iframe) {
                iframe.addEventListener('load', function() {
                    try {
                        var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        var playAudioOnInt = function() {
                            if (getSettings().musicEnabled && bgAudio.paused) {
                                bgAudio.play().catch(function(){});
                            }
                        };
                        iframeDoc.addEventListener('click', playAudioOnInt);
                        iframeDoc.addEventListener('touchstart', playAudioOnInt);
                    } catch(e) {
                        console.warn("[Antiko Shell] Failed to attach interaction listener to iframe document:", e);
                    }
                });
            }

            // Initialize Background Audio
            updateAudioState();

            // Listen for settings modifications from the child iframe settings panel
            window.addEventListener('storage', function(e) {
                if (e.key === 'antiko_settings') {
                    settings = getSettings();
                    updateAudioState();
                }
            });

            // Tab Visibility, minimize, active window change support
            document.addEventListener("visibilitychange", function() {
                if (document.hidden) {
                    bgAudio.pause();
                } else {
                    if (getSettings().musicEnabled) {
                        bgAudio.play().catch(function(){});
                    }
                }
            });

            window.addEventListener("blur", function() {
                bgAudio.pause();
            });

            window.addEventListener("focus", function() {
                if (getSettings().musicEnabled) {
                    bgAudio.play().catch(function(){});
                }
            });

            // Capacitor appStateChange support inside parent shell
            (async function() {
                try {
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                        window.Capacitor.Plugins.App.addListener('appStateChange', function(info) {
                            if (info && info.isActive === false) {
                                bgAudio.pause();
                            } else {
                                if (getSettings().musicEnabled) {
                                    bgAudio.play().catch(function(){});
                                }
                            }
                        });
                    }
                } catch(e) {
                    console.warn("[Antiko Shell] Capacitor listener init failed:", e);
                }
            })();
        })();
    </script>
</body>
</html>
